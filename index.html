<title>まめクエスト 日本語版</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&family=Noto+Sans+TC:wght@500;700&display=swap">
<style>
/* Layout: phone-first game shell — top status bar, zigzag unit path, full-screen lesson with bottom feedback sheet */
:root{
  --bg:#fbf7ee; --card:#ffffff; --ink:#2b2924; --muted:#7c766a; --line:#e7e0d1;
  --green:#2f9e63; --green-d:#1f7448; --green-s:#dcf3e5;
  --red:#e0564b; --red-d:#b23d33; --red-s:#fde4e1;
  --gold:#f0a92b; --blue:#3b8fd6; --brown:#7a4b2a;
  --f:"M PLUS Rounded 1c","Noto Sans TC","Hiragino Maru Gothic ProN","PingFang TC",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#17150f; --card:#232019; --ink:#f2ede1; --muted:#a8a192; --line:#3b362b;
  --green:#4cb97c; --green-d:#2c7f52; --green-s:#1f3a2a; --red:#f07b70; --red-d:#b34d43; --red-s:#3e2420;
  --gold:#f3b443; --blue:#5aa5e6; --brown:#c48a5c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17150f; --card:#232019; --ink:#f2ede1; --muted:#a8a192; --line:#3b362b;
  --green:#4cb97c; --green-d:#2c7f52; --green-s:#1f3a2a; --red:#f07b70; --red-d:#b34d43; --red-s:#3e2420;
  --gold:#f3b443; --blue:#5aa5e6; --brown:#c48a5c; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.6;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding-inline:16px}
/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding-block:12px;border-bottom:2px solid var(--line)}
.stat{display:flex;align-items:center;gap:4px;font-weight:800;font-size:15px;font-variant-numeric:tabular-nums}
.stat svg{width:24px;height:24px}
.grow{flex:1}
.seg{display:flex;border:2px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{border:0;background:var(--card);color:var(--muted);font-weight:800;font-size:13px;padding:6px 10px}
.seg button[aria-pressed="true"]{background:var(--green);color:#fff}
.iconbtn{border:2px solid var(--line);background:var(--card);border-radius:12px;width:36px;height:34px;display:grid;place-items:center;color:var(--muted)}
.iconbtn svg{width:18px;height:18px}
/* home */
.hello{display:flex;gap:14px;align-items:center;padding-block:20px 6px}
.hello svg{width:76px;height:76px;flex:none}
.bubble{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:10px 14px;font-weight:500;position:relative}
.bubble b{color:var(--green)}
.path{display:flex;flex-direction:column;align-items:center;gap:6px;padding-block:18px 60px}
.unitrow{width:100%;display:flex;align-items:center;gap:14px}
.node{width:76px;height:72px;border-radius:50%;border:0;display:grid;place-items:center;position:relative;flex:none;color:#fff;
  box-shadow:0 6px 0 rgba(0,0,0,.18);transition:transform .08s}
.node:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
.node svg.ic{width:40px;height:40px}
.ring{position:absolute;inset:-7px;pointer-events:none}
.unitlabel{min-width:0;flex:1}
.unitlabel .t{font-weight:800;font-size:16px;line-height:1.3}
.unitlabel .s{font-size:13px;color:var(--muted)}
.crowns{display:flex;gap:2px;margin-top:3px}
.crowns i{width:14px;height:6px;border-radius:3px;background:var(--line)}
.crowns i.on{background:var(--gold)}
.next{position:absolute;top:-30px;left:50%;transform:translateX(-50%);background:var(--card);border:2px solid var(--line);color:var(--green);font-weight:800;font-size:12px;padding:2px 8px;border-radius:10px;white-space:nowrap;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translate(-50%,-4px)}}
.connector{width:6px;height:18px;border-radius:3px;background:var(--line)}
/* lesson */
.lesson{display:flex;flex-direction:column;min-height:100%;padding-bottom:0}
.lhead{display:flex;align-items:center;gap:12px;padding-block:14px}
.close{border:0;background:none;color:var(--muted);width:32px;height:32px;display:grid;place-items:center}
.close svg{width:22px;height:22px}
.pbar{flex:1;height:16px;background:var(--line);border-radius:8px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--green);border-radius:8px;transition:width .35s;position:relative}
.pbar i::after{content:"";position:absolute;left:8px;right:8px;top:4px;height:4px;border-radius:2px;background:rgba(255,255,255,.35)}
.qwrap{flex:1;padding-block:8px 180px;display:flex;flex-direction:column;gap:16px}
.qtype{font-size:13px;font-weight:800;color:var(--blue);letter-spacing:.04em}
.qtext{font-size:21px;font-weight:800;line-height:1.45;text-wrap:balance}
.qrow{display:flex;gap:12px;align-items:flex-start}
.qrow > svg.mascot{width:64px;height:64px;flex:none}
.qimg{display:flex;justify-content:center}
.qimg svg{max-width:100%;height:auto}
.opts{display:grid;gap:10px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{background:var(--card);color:var(--ink);border:2px solid var(--line);border-bottom-width:5px;border-radius:14px;padding:12px 14px;font-size:16px;font-weight:500;text-align:left;display:flex;gap:10px;align-items:center;min-height:54px}
.opt .k{flex:none;width:26px;height:26px;border:2px solid var(--line);border-radius:8px;display:grid;place-items:center;font-size:12px;color:var(--muted);font-weight:800}
.opt[aria-pressed="true"]{border-color:var(--blue);background:color-mix(in srgb,var(--blue) 12%,var(--card));color:var(--ink)}
.opt[aria-pressed="true"] .k{border-color:var(--blue);color:var(--blue)}
.opt.big{justify-content:center;font-size:22px;font-weight:800;min-height:84px}
.opt.ok{border-color:var(--green);background:var(--green-s)}
.opt.ng{border-color:var(--red);background:var(--red-s)}
.opt:disabled{cursor:default}
.opt.gone{opacity:.35}
.hint{font-size:13px;color:var(--muted);font-weight:500}
/* fill */
.sentence{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:14px;font-size:17px;line-height:2.2}
.blank{display:inline-block;min-width:72px;border-bottom:3px solid var(--muted);margin:0 3px;text-align:center;vertical-align:bottom;line-height:1.6}
.blank button{border:2px solid var(--line);border-bottom-width:4px;background:var(--card);color:var(--ink);border-radius:10px;padding:1px 10px;font-size:16px;font-weight:500}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{border:2px solid var(--line);border-bottom-width:4px;background:var(--card);color:var(--ink);border-radius:12px;padding:8px 14px;font-size:16px;font-weight:500}
.chip:disabled{visibility:hidden}
/* match */
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .col{display:flex;flex-direction:column;gap:10px;min-width:0}
.match .opt{min-height:58px;justify-content:center;text-align:center;font-size:15px;padding:8px}
.match .opt.flash{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
/* bottom sheet */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:10;border-top:2px solid var(--line);background:var(--bg);padding:14px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.sheet .in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.sheet.ok{background:var(--green-s);border-color:transparent}
.sheet.ng{background:var(--red-s);border-color:transparent}
.verdict{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:800}
.sheet.ok .verdict{color:var(--green-d)}
.sheet.ng .verdict{color:var(--red-d)}
:root[data-theme="dark"] .sheet.ok .verdict{color:var(--green)}
:root[data-theme="dark"] .sheet.ng .verdict{color:var(--red)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .sheet.ok .verdict{color:var(--green)} :root:not([data-theme="light"]) .sheet.ng .verdict{color:var(--red)}}
.verdict svg{width:34px;height:34px}
.exp{font-size:14px;font-weight:500;color:var(--ink)}
.exp b{font-weight:800}
.cta{width:100%;border:0;border-radius:16px;padding:14px;font-size:17px;font-weight:800;letter-spacing:.04em;color:#fff;background:var(--green);box-shadow:0 5px 0 var(--green-d);text-transform:uppercase}
.cta:active{transform:translateY(3px);box-shadow:0 2px 0 var(--green-d)}
.cta.ng{background:var(--red);box-shadow:0 5px 0 var(--red-d)}
.cta:disabled{background:var(--line);color:var(--muted);box-shadow:0 5px 0 color-mix(in srgb,var(--line) 70%,#000 10%);cursor:default}
.ghost{background:none;border:0;color:var(--muted);font-weight:800;font-size:14px;padding:8px}
/* end screens */
.end{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding-block:40px 30px;flex:1}
.end svg.mascot{width:140px;height:140px}
.end h2{margin:0;font-size:26px;font-weight:800;color:var(--gold)}
.end p{margin:0;color:var(--muted)}
.tiles{display:flex;gap:10px;width:100%;justify-content:center;flex-wrap:wrap}
.tile{border:2px solid;border-radius:14px;min-width:120px;overflow:hidden}
.tile .h{color:#fff;font-size:12px;font-weight:800;padding:3px 0}
.tile .v{font-size:22px;font-weight:800;padding:8px;font-variant-numeric:tabular-nums;background:var(--card)}
.endbtns{width:100%;display:flex;flex-direction:column;gap:10px;margin-top:auto}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:end center;z-index:20}
.modal .box{background:var(--card);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:22px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;text-align:center}
.modal h3{margin:0;font-size:20px}
.modal p{margin:0 0 6px;color:var(--muted)}
.foot{font-size:12px;color:var(--muted);text-align:center;padding-bottom:24px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

/* prepare a question instance: shuffle options */
function inst(q){
 const c={...q};
 if(q.t==="mc"||q.t==="multi"){
  const idx=shuffle(q.opts.map((_,i)=>i));
  c.opts=idx.map(i=>q.opts[i]);
  c.a=q.t==="mc"?idx.indexOf(q.a):q.a.map(a=>idx.indexOf(a));
 }
 if(q.t==="fill"){c.bank=shuffle([...q.a,...q.d])}
 if(q.t==="match"){c.R=shuffle(q.pairs.map((p,i)=>i));c.Lo=shuffle(q.pairs.map((p,i)=>i))}
 return c;
}

 const n=unit&&unit.boss?pool.length:Math.min(10,pool.length);
 // prefer variety of types
 let qs=shuffle(pool);
 const matches=qs.filter(q=>q.t==="match").slice(0,2), rest=qs.filter(q=>q.t!=="match");

}

  body=`<div class="hint">${u.selectAll}</div><div class="opts">${q.opts.map((o,i)=>`<button class="opt" data-i="${i}" aria-pressed="${sel.includes(i)}"><span class="k">${sel.includes(i)?"✓":i+1}</span><span>${L(o)}</span></button>`).join("")}</div>`;
 }else if(q.t==="tf"){
  body=`<div class="opts two"><button class="opt big" data-i="1" aria-pressed="${G.sel===1}">○ ${u.T}</button><button class="opt big" data-i="0" aria-pressed="${G.sel===0}">× ${u.F}</button></div>`;
 }else if(q.t==="fill"){
  const f=G.sel||[];let k=0;
  const parts=q.s.split("___");
  const sent=parts.map((p,i)=>i<parts.length-1?`${p}<span class="blank">${f[i]!=null?`<button data-b="${i}">${q.bank[f[i]]}</button>`:"&nbsp;"}</span>`:p).join("");
  body=`<div class="sentence">${sent}</div><div class="bank">${q.bank.map((w,i)=>`<button class="chip" data-c="${i}" ${f.includes(i)?"disabled":""}>${w}</button>`).join("")}</div>`;
 }else if(q.t==="match"){
  const m=G.sel||{l:null,done:[],bad:null};
  body=`<div class="match"><div class="col">${q.Lo.map(i=>`<button class="opt ${m.done.includes(i)?"gone":""}" data-l="${i}" ${m.done.includes(i)?"disabled":""} aria-pressed="${m.l===i}">${L(q.pairs[i][0])}</button>`).join("")}</div><div class="col">${q.R.map(i=>`<button class="opt ${m.done.includes(i)?"gone":""} ${m.bad===i?"flash":""}" data-r="${i}" ${m.done.includes(i)?"disabled":""}>${L(q.pairs[i][1])}</button>`).join("")}</div></div>`;
 }
 const showMascot=!q.img&&(q.t==="mc"||q.t==="tf");
 app.innerHTML=`<div class="lesson">
  <div class="lhead"><button class="close" id="quit" aria-label="close">${svgI.x}</button><div class="pbar"><i style="width:${pct}%"></i></div><div class="stat">${svgI.heart}<span>${G.hearts}</span></div></div>
  <div class="qwrap">
   <div class="qtype">${q.t==="multi"?"MULTI":q.t==="match"?"MATCH":q.t==="fill"?"FILL":q.t==="tf"?"○ ×":"QUIZ"} · ${G.done+1}/${G.total}</div>
   ${showMascot?`<div class="qrow">${mascot("neutral")}<div class="qtext">${prompt}</div></div>`:`<div class="qtext">${prompt}</div>`}
   ${img}${body}
  </div>
  ${sheet(q)}
 </div>`;
 bindQ(q);
}
function ready(q){
 if(q.t==="mc"||q.t==="tf")return G.sel!=null;
 if(q.t==="multi")return (G.sel||[]).length>0;
 if(q.t==="fill")return (G.sel||[]).filter(x=>x!=null).length===q.a.length;
 return false;
}
function sheet(q){
 const u=UI[S.lang];
 if(G.state==="ask"){
  if(q.t==="match")return "";
  return `<div class="sheet"><div class="in"><button class="cta" id="chk" ${ready(q)?"":"disabled"}>${u.check}</button></div></div>`;
 }
 const ok=G.state==="ok";
 const ex=q.ex?`<div class="exp">${L(q.ex)}</div>`:"";
 const ansTxt=ok?"":`<div class="exp"><b>${u.ans}</b>${answerText(q)}</div>`;
 const head=ok?(q.t==="match"&&!G.matchErr?u.skipMatch:u.ok[Math.floor(Math.random()*u.ok.length)]):u.ng;
 return `<div class="sheet ${ok?"ok":"ng"}"><div class="in"><div class="verdict">${ok?svgI.okc:svgI.ngc}<span>${head}</span></div>${ansTxt}${ex}${ok?"":`<div class="exp">${u.ngSub}</div>`}<button class="cta ${ok?"":"ng"}" id="cont">${u.cont}</button></div></div>`;
}
function answerText(q){
 if(q.t==="mc")return L(q.opts[q.a]);
 if(q.t==="multi")return q.a.map(i=>L(q.opts[i])).join(" ／ ");
 if(q.t==="tf")return q.a?UI[S.lang].T:UI[S.lang].F;
 if(q.t==="fill")return q.a.join("・");
 if(q.t==="match")return q.pairs.map(p=>`${L(p[0])}＝${L(p[1])}`).join("、");
 return "";
}
function bindQ(q){
 const qt=app.querySelector("#quit");qt.onclick=confirmQuit;
 if(G.state!=="ask"){app.querySelector("#cont").onclick=next;app.querySelector("#cont").focus();return}
 if(q.t==="mc"||q.t==="tf")app.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{G.sel=+b.dataset.i;renderQ()});
 if(q.t==="multi")app.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{const i=+b.dataset.i;G.sel=G.sel||[];G.sel=G.sel.includes(i)?G.sel.filter(x=>x!==i):[...G.sel,i];renderQ()});
 if(q.t==="fill"){
  app.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{G.sel=G.sel||[];let slot=-1;for(let i=0;i<q.a.length;i++){if(G.sel[i]==null){slot=i;break}}if(slot<0)return;G.sel[slot]=+b.dataset.c;renderQ()});
  app.querySelectorAll("[data-b]").forEach(b=>b.onclick=()=>{G.sel[+b.dataset.b]=null;renderQ()});
 }
 if(q.t==="match"){
  G.sel=G.sel||{l:null,done:[],bad:null};
  app.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>{G.sel.l=+b.dataset.l;G.sel.bad=null;renderQ()});
  app.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{
   const r=+b.dataset.r;if(G.sel.l==null)return;
   if(r===G.sel.l){G.sel.done.push(r);G.sel.l=null;G.sel.bad=null;beepSoft();if(G.sel.done.length===q.pairs.length){G.state="ok";G.done++;if(!G.seen.has(q.id)&&!G.matchErr)G.firstTry++;G.seen.add(q.id);if(G.matchErr)addMiss(q.id);else removeMiss(q.id);beep(true)}}
   else{G.sel.bad=r;G.matchErr=true}
   renderQ();
  });
 }
 const c=app.querySelector("#chk");if(c)c.onclick=check;
}
function beepSoft(){if(!S.sound)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;o.frequency.value=740;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.08,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.12);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+.13)}catch(e){}}
function addMiss(id){if(!S.miss.includes(id))S.miss.push(id);save()}
function removeMiss(id){S.miss=S.miss.filter(x=>x!==id);save()}
function check(){
 const q=G.queue[0];if(!ready(q))return;
 let ok=false;
 if(q.t==="mc")ok=G.sel===q.a;
 if(q.t==="tf")ok=(G.sel===1)===q.a;
 if(q.t==="multi"){const s=[...G.sel].sort().join(),a=[...q.a].sort().join();ok=s===a}
 if(q.t==="fill")ok=G.sel.every((b,i)=>q.bank[b]===q.a[i]);
 G.state=ok?"ok":"ng";beep(ok);
 if(ok){G.done++;if(!G.seen.has(q.id))G.firstTry++;removeMiss(q.id)}
 else{G.hearts--;G.errors++;addMiss(q.id)}
 G.seen.add(q.id);
 renderQ();
}
function next(){
 const q=G.queue.shift();
 if(G.state==="ng"){G.queue.push(inst(ALLQ[q.id]||q))}
 G.state="ask";G.sel=null;G.matchErr=false;
 if(G.hearts<=0)return outOfHearts();
 renderQ();
}
function finish(){
 const u=UI[S.lang];const uid=G.uid;
 const perfect=G.errors===0;const gain=10+(perfect?5:0)+(uid==="bs"?10:0);
 S.xp+=gain;if(uid!=="review")S.crowns[uid]=(S.crowns[uid]||0)+1;
 if(!S.days.includes(today()))S.days.push(today());save();
 const acc=Math.round(G.firstTry/G.total*100);const sec=Math.round((Date.now()-G.t0)/1000);
 const time=`${Math.floor(sec/60)}:${String(sec%60).padStart(2,"0")}`;
 G=null;
 app.innerHTML=`<div class="end">${mascot("happy")}<h2>${perfect?u.perfect:u.done}</h2><p>${L(UNITS.find(x=>x.id===uid)?.t)||u.review}</p>
  <div class="tiles"><div class="tile" style="border-color:var(--gold)"><div class="h" style="background:var(--gold)">${u.xp}</div><div class="v">+${gain}</div></div><div class="tile" style="border-color:var(--green)"><div class="h" style="background:var(--green)">${u.acc}</div><div class="v">${acc}%</div></div><div class="tile" style="border-color:var(--blue)"><div class="h" style="background:var(--blue)">${u.time}</div><div class="v">${time}</div></div></div>
  <div class="endbtns"><button class="cta" id="h">${u.home}</button><button class="ghost" id="a">${u.again}</button></div></div>`;
 app.querySelector("#h").onclick=home;app.querySelector("#a").onclick=()=>start(uid);
}
function outOfHearts(){
 const u=UI[S.lang];const uid=G.uid;G=null;
 app.innerHTML=`<div class="end">${mascot("sad")}<h2 style="color:var(--red)">${u.out}</h2><p>${u.outSub}</p><div class="endbtns"><button class="cta" id="a">${u.again}</button><button class="ghost" id="r">${u.review}</button><button class="ghost" id="h">${u.home}</button></div></div>`;
 app.querySelector("#a").onclick=()=>start(uid);app.querySelector("#r").onclick=()=>start("review");app.querySelector("#h").onclick=home;
}
function confirmQuit(){
 const u=UI[S.lang];const m=document.createElement("div");m.className="modal";
 m.innerHTML=`<div class="box">${mascot("sad").replace('class="mascot"','class="mascot" width="90" height="90" style="align-self:center"')}<h3>${u.quit}</h3><p>${u.quitSub}</p><button class="cta" id="k">${u.keep}</button><button class="ghost" id="l" style="color:var(--red)">${u.leave}</button></div>`;
 document.body.appendChild(m);m.querySelector("#k").onclick=()=>m.remove();m.querySelector("#l").onclick=()=>{m.remove();home()};
}
document.addEventListener("keydown",e=>{
 if(!G)return;const q=G.queue[0];if(!q)return;
 if(e.key==="Enter"){e.preventDefault();if(G.state==="ask"){if(ready(q))check()}else next();return}
 if(G.state==="ask"&&/^[1-5]$/.test(e.key)){const i=+e.key-1;
  if(q.t==="mc"&&i<q.opts.length){G.sel=i;renderQ()}
  if(q.t==="multi"&&i<q.opts.length){G.sel=G.sel||[];G.sel=G.sel.includes(i)?G.sel.filter(x=>x!==i):[...G.sel,i];renderQ()}
  if(q.t==="tf"&&i<2){G.sel=i===0?1:0;renderQ()}
 }
});
document.documentElement.lang=S.lang==="ja"?"ja":"zh-Hant";
home();
</script>

</body></html>
